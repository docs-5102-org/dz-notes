<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1320" viewBox="0 0 1920 1320" role="img" aria-labelledby="title desc">
<title id="title">Codex Harness：一轮对话如何运行</title>
<desc id="desc">左侧是任务主循环，右侧对应三处细节。工具结果回到上下文组装；审批通过后才执行；轮次终态独立于最终回复展示。</desc>
<defs>
<marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52656d"/></marker>
<marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#008575"/></marker>
</defs>
<rect width="1920" height="1320" fill="#fbfcfb"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
<text x="55" y="43" font-size="22" fill="#008575" font-weight="700" text-anchor="start">CODEX / AGENT LOOP</text>
<text x="55" y="104" font-size="54" fill="#15313d" font-weight="700" text-anchor="start">Codex Harness：一轮对话如何运行</text>
<text x="55" y="145" font-size="24" fill="#526b75" font-weight="400" text-anchor="start">左侧看主流程，右侧展开实现细节；同一 turn 可以多次请求模型、调用工具。</text>
<path d="M50 165 H1870" stroke="#008575" stroke-width="2"/>
<text x="55" y="206" font-size="29" fill="#15313d" font-weight="700" text-anchor="start">01  主流程｜任务如何运行</text>
<text x="525" y="205" font-size="20" fill="#7660c7" font-weight="600" text-anchor="start">①②③ 对应右侧详解</text>
<text x="1000" y="206" font-size="29" fill="#15313d" font-weight="700" text-anchor="start">02  细节展开｜Harness 做了什么</text>
<rect x="70" y="230" width="800" height="80" rx="14" fill="#f3f1ed" stroke="#b8b2aa" stroke-width="1.4"/>
<text x="92" y="263" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">用户提交任务</text>
<text x="92" y="291" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">来自 CLI、IDE 或桌面客户端</text>
<path d="M470 310 V340" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<rect x="70" y="342" width="800" height="92" rx="14" fill="#f0ecff" stroke="#9d89da" stroke-width="1.4"/>
<circle cx="101" cy="375" r="18" fill="#7660c7"/>
<text x="101" y="382" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="130" y="375" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">Harness 组织上下文并请求模型</text>
<text x="130" y="403" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">指令、可用工具、当前对话上下文</text>
<path d="M470 434 V464" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<rect x="70" y="466" width="800" height="90" rx="14" fill="#e7f6f0" stroke="#60b6a6" stroke-width="1.4"/>
<text x="92" y="499" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">模型推理</text>
<text x="92" y="527" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">经 Responses API 生成消息或工具调用请求</text>
<text x="595" y="500" font-size="18" fill="#405b65" font-weight="400" text-anchor="start">中间说明可先展示，</text>
<text x="595" y="529" font-size="18" fill="#405b65" font-weight="400" text-anchor="start">随后继续调用工具。</text>
<path d="M470 556 V579 H245 V610" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<path d="M470 579 H685 V610" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<rect x="50" y="612" width="390" height="403" rx="14" fill="#edf7f3" stroke="#a1cfc5" stroke-width="1.4"/>
<rect x="475" y="612" width="420" height="403" rx="14" fill="#f0f3fc" stroke="#b5c4e0" stroke-width="1.4"/>
<text x="72" y="654" font-size="29" fill="#005f55" font-weight="700" text-anchor="start">A  输出最终回复</text>
<text x="497" y="654" font-size="29" fill="#254c7e" font-weight="700" text-anchor="start">B  请求调用工具</text>
<rect x="70" y="678" width="350" height="77" rx="14" fill="#ffffff" stroke="#cbd8dc" stroke-width="1.4"/>
<text x="92" y="711" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">模型生成最终回复</text>
<text x="92" y="739" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">回答、追问或说明阻碍</text>
<path d="M245 755 V789" fill="none" stroke="#008575" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="791" width="350" height="77" rx="14" fill="#07695e" stroke="#07695e" stroke-width="1.4"/>
<text x="92" y="824" font-size="25" fill="#ffffff" font-weight="700" text-anchor="start">Harness 转交输出</text>
<text x="92" y="852" font-size="19" fill="#d5f3ed" font-weight="400" text-anchor="start">向客户端发送消息与事件</text>
<path d="M245 868 V902" fill="none" stroke="#008575" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<rect x="70" y="904" width="350" height="77" rx="14" fill="#ffffff" stroke="#cbd8dc" stroke-width="1.4"/>
<text x="92" y="937" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">客户端展示</text>
<text x="92" y="965" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">文字可流式呈现</text>
<rect x="495" y="678" width="380" height="77" rx="14" fill="#ffffff" stroke="#b5c4e0" stroke-width="1.4"/>
<circle cx="526" cy="711" r="18" fill="#7660c7"/>
<text x="526" y="718" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="555" y="711" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">Harness 检查权限并调度</text>
<text x="555" y="739" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">按策略放行，必要时审批</text>
<path d="M685 755 V796" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<text x="702" y="782" font-size="19" fill="#008575" font-weight="700" text-anchor="start">免审批或已获准</text>
<rect x="495" y="798" width="380" height="70" rx="14" fill="#fff8ec" stroke="#d8bc7b" stroke-width="1.4"/>
<text x="517" y="831" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">工具执行操作</text>
<text x="517" y="859" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">读取文件、运行命令、测试或访问服务</text>
<path d="M685 868 V891" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<rect x="495" y="893" width="380" height="77" rx="14" fill="#ffffff" stroke="#b5c4e0" stroke-width="1.4"/>
<circle cx="526" cy="926" r="18" fill="#7660c7"/>
<text x="526" y="933" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="555" y="926" font-size="25" fill="#132f40" font-weight="700" text-anchor="start">Harness 接收工具结果</text>
<text x="555" y="954" font-size="19" fill="#47616b" font-weight="400" text-anchor="start">关联调用，更新上下文</text>
<text x="495" y="995" font-size="18" fill="#526b75" font-weight="400" text-anchor="start">可同步展示日志；拒绝不执行，反馈状态。</text>
<path d="M875 931 H914 Q927 931 927 918 V401 Q927 388 914 388 H873" fill="none" stroke="#008575" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#teal)"/>
<text x="950" y="790" transform="rotate(-90 950 790)" font-size="22" fill="#008575" font-weight="700">同一 turn 内继续循环</text>
<rect x="50" y="1034" width="845" height="110" rx="14" fill="#f2f1ee" stroke="#b8b2aa" stroke-width="1.4"/>
<text x="72" y="1065" font-size="24" fill="#15313d" font-weight="700" text-anchor="start">本轮终态｜适用于所有路径</text>
<text x="72" y="1092" font-size="19" fill="#233d48" font-weight="400" text-anchor="start">app-server 发出 turn/completed，客户端检查 turn.status</text>
<text x="72" y="1118" font-size="19" fill="#006858" font-weight="700" text-anchor="start">completed（正常结束） / failed（失败） / interrupted（中断）</text>
<text x="72" y="1138" font-size="16" fill="#526b75" font-weight="400" text-anchor="start">失败或中断可直接结束，无需先生成最终回复。</text>
<rect x="1000" y="230" width="870" height="255" rx="14" fill="#f4f1ff" stroke="#a18ddd" stroke-width="1.4"/>
<circle cx="1034" cy="265" r="18" fill="#7660c7"/>
<text x="1034" y="272" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<text x="1065" y="275" font-size="30" fill="#15313d" font-weight="700" text-anchor="start">请求组装与上下文管理</text>
<rect x="1025" y="299" width="265" height="45" rx="9" fill="#ffffff" stroke="#ccc1eb" stroke-width="1.4"/>
<text x="1038" y="329" font-size="21" fill="#433885" font-weight="600" text-anchor="start">instructions  基础指令</text>
<rect x="1305" y="299" width="240" height="45" rx="9" fill="#ffffff" stroke="#ccc1eb" stroke-width="1.4"/>
<text x="1318" y="329" font-size="21" fill="#433885" font-weight="600" text-anchor="start">tools  工具定义</text>
<rect x="1560" y="299" width="285" height="45" rx="9" fill="#ffffff" stroke="#ccc1eb" stroke-width="1.4"/>
<text x="1573" y="329" font-size="21" fill="#433885" font-weight="600" text-anchor="start">input  消息与结构化条目</text>
<text x="1025" y="378" font-size="22" fill="#405b65" font-weight="400" text-anchor="start">input 可包含权限说明、AGENTS.md、环境信息、用户消息、</text>
<text x="1025" y="410" font-size="22" fill="#405b65" font-weight="400" text-anchor="start">历史及工具交互。达到阈值时，按配置压缩上下文。</text>
<rect x="1025" y="432" width="820" height="35" rx="7" fill="#e8e2fa" stroke="#e8e2fa" stroke-width="1.4"/>
<text x="1040" y="457" font-size="21" fill="#493a86" font-weight="700" text-anchor="start">携带当前上下文，不保证永久保留全部原始历史。</text>
<rect x="1000" y="505" width="870" height="285" rx="14" fill="#eff8f7" stroke="#6ca8a5" stroke-width="1.4"/>
<circle cx="1034" cy="540" r="18" fill="#7660c7"/>
<text x="1034" y="547" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<text x="1065" y="550" font-size="30" fill="#15313d" font-weight="700" text-anchor="start">权限检查与执行边界</text>
<rect x="1025" y="575" width="180" height="42" rx="9" fill="#ffffff" stroke="#b9c7db" stroke-width="1.4"/>
<text x="1050" y="604" font-size="23" fill="#254c7e" font-weight="600" text-anchor="start">检查策略</text>
<path d="M1216 596 H1260" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<rect x="1275" y="575" width="570" height="42" rx="9" fill="#e1f3e9" stroke="#98c9ad" stroke-width="1.4"/>
<text x="1297" y="604" font-size="23" fill="#006858" font-weight="600" text-anchor="start">允许执行 / 请求审批 / 拒绝调用</text>
<text x="1025" y="653" font-size="22" fill="#405b65" font-weight="400" text-anchor="start">Shell：按沙箱配置约束文件、网络与命令执行。</text>
<text x="1025" y="684" font-size="22" fill="#405b65" font-weight="400" text-anchor="start">MCP：可连接本地或远程服务；执行隔离由服务环境保障，</text>
<text x="1025" y="715" font-size="22" fill="#405b65" font-weight="400" text-anchor="start">调用仍可受工具配置、身份授权与审批策略控制。</text>
<rect x="1025" y="742" width="820" height="34" rx="7" fill="#dcf0e7" stroke="#dcf0e7" stroke-width="1.4"/>
<text x="1040" y="766" font-size="20" fill="#006858" font-weight="700" text-anchor="start">获准后才执行；拒绝与失败需反馈，能否继续取决于运行状态。</text>
<rect x="1000" y="810" width="870" height="266" rx="14" fill="#f4f1ff" stroke="#a18ddd" stroke-width="1.4"/>
<circle cx="1034" cy="845" r="18" fill="#7660c7"/>
<text x="1034" y="852" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="1065" y="855" font-size="30" fill="#15313d" font-weight="700" text-anchor="start">结果回流与下一次请求</text>
<rect x="1025" y="878" width="250" height="43" rx="9" fill="#ffffff" stroke="#c5b8e6" stroke-width="1.4"/>
<text x="1150" y="908" font-size="23" fill="#493a86" font-weight="600" text-anchor="middle">关联调用</text>
<rect x="1310" y="878" width="250" height="43" rx="9" fill="#ffffff" stroke="#c5b8e6" stroke-width="1.4"/>
<text x="1435" y="908" font-size="23" fill="#493a86" font-weight="600" text-anchor="middle">追加结果</text>
<rect x="1595" y="878" width="250" height="43" rx="9" fill="#ffffff" stroke="#c5b8e6" stroke-width="1.4"/>
<text x="1720" y="908" font-size="23" fill="#493a86" font-weight="600" text-anchor="middle">再次请求模型</text>
<path d="M1283 900 H1300" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<path d="M1568 900 H1585" fill="none" stroke="#52656d" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#gray)"/>
<text x="1025" y="952" font-size="22" fill="#405b65" font-weight="400" text-anchor="start">保留必要的模型输出、工具调用与对应结果。</text>
<text x="1025" y="984" font-size="22" fill="#405b65" font-weight="400" text-anchor="start">尽量保持稳定前缀；压缩或配置变化可能影响缓存复用。</text>
<rect x="1025" y="1013" width="820" height="43" rx="7" fill="#e8e2fa" stroke="#e8e2fa" stroke-width="1.4"/>
<text x="1040" y="1043" font-size="24" fill="#493a86" font-weight="700" text-anchor="start">一次 turn 可包含一次或多次模型请求。</text>
<text x="1005" y="1112" font-size="20" fill="#526b75" font-weight="400" text-anchor="start">图示聚焦宿主调度工具；API 托管工具可在服务端执行。</text>
<text x="1005" y="1140" font-size="20" fill="#526b75" font-weight="400" text-anchor="start">编号仅作细节引用；图中省略并发、恢复及部分中间事件。</text>
<path d="M50 1170 H1870" stroke="#008575" stroke-width="2"/>
<text x="55" y="1208" font-size="25" fill="#15313d" font-weight="700" text-anchor="start">直接回复</text>
<text x="55" y="1237" font-size="20" fill="#405b65" font-weight="400" text-anchor="start">可以不调用工具；回复仍由</text>
<text x="55" y="1264" font-size="20" fill="#405b65" font-weight="400" text-anchor="start">Harness 转交客户端。</text>
<text x="665" y="1208" font-size="25" fill="#15313d" font-weight="700" text-anchor="start">结束信号</text>
<text x="665" y="1237" font-size="20" fill="#405b65" font-weight="400" text-anchor="start">文字展示不等于本轮结束；正常结束</text>
<text x="665" y="1264" font-size="20" fill="#405b65" font-weight="400" text-anchor="start">也不保证用户目标已全部达成。</text>
<text x="1275" y="1208" font-size="25" fill="#15313d" font-weight="700" text-anchor="start">适用范围</text>
<text x="1275" y="1237" font-size="20" fill="#405b65" font-weight="400" text-anchor="start">Codex 常规循环示意；自建应用可</text>
<text x="1275" y="1264" font-size="20" fill="#405b65" font-weight="400" text-anchor="start">显式配置工具结果直接交付策略。</text>
<text x="55" y="1300" font-size="18" fill="#526b75" font-weight="400" text-anchor="start">依据 OpenAI Agent loop、Codex App Server 与 MCP 文档整理 · 本文配图，非官方架构图</text>
<text x="1450" y="1300" font-size="18" fill="#526b75" font-weight="400" text-anchor="start">实线：执行流程    编号：细节引用</text>
</g></svg>