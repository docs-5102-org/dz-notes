name: 验证 Next.js 文档

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: 构建校验
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 Next.js 文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: pnpm run build
